<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aura Bot Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'VT323',monospace;font-size:21px;color:#fff;overflow-x:hidden;background:#5b8cff}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;z-index:-2}
.veil{position:fixed;inset:0;background:rgba(8,10,18,.45);z-index:-1}
h1,h2,h3,.btn,.tab,.logo,.num{font-family:'Press Start 2P',monospace;font-weight:400}
a{color:inherit}.mut{color:#cfcfcf}
.wrap{max-width:1040px;margin:auto;padding:14px}
.panel{background:rgba(40,40,40,.9);border:4px solid #000;box-shadow:inset 4px 4px 0 #6b6b6b,inset -4px -4px 0 #1e1e1e;padding:16px;margin-bottom:14px}
nav{position:sticky;top:8px;z-index:9;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 14px;margin-bottom:18px}
.logo{text-decoration:none;font-size:14px;text-shadow:3px 3px #000;color:#8aff6a}
.links{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.links a.l{text-decoration:none;font-family:'Press Start 2P';font-size:10px;padding:9px 10px;color:#ddd}
.links a.l:hover,.links a.l.on{background:#000;color:#8aff6a}
.av{width:28px;height:28px;border:3px solid #000;vertical-align:middle}
.btn{display:inline-block;background:#707070;color:#fff;text-decoration:none;border:4px solid #000;box-shadow:inset 3px 3px 0 #b0b0b0,inset -3px -3px 0 #3d3d3d;padding:12px 16px;font-size:11px;cursor:pointer;text-shadow:2px 2px #333;margin:3px 2px}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(3px)}
.btn.g{background:#4f9a35;box-shadow:inset 3px 3px 0 #86d65f,inset -3px -3px 0 #2b5a1d}
.btn.d{background:#5865F2;box-shadow:inset 3px 3px 0 #8f99ff,inset -3px -3px 0 #3441b8}
.btn.sm{padding:8px 10px;font-size:9px}
.hero{text-align:center;padding:34px 4px 18px}
.hero h1{font-size:clamp(26px,7vw,52px);margin:0 0 16px;text-shadow:5px 5px #000,-2px -2px #2b5a1d;line-height:1.2}
.hero p{font-size:24px;max-width:600px;margin:0 auto 22px;text-shadow:2px 2px #000}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.stats .panel{text-align:center;margin:0}.num{font-size:20px;display:block;color:#8aff6a;margin-bottom:6px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
.ic{font-size:30px;display:block;margin-bottom:6px}
h2.t{font-size:15px;margin:26px 0 12px;text-shadow:3px 3px #000}
h3{font-size:12px;margin:0 0 10px;line-height:1.5}
.srv{display:flex;flex-direction:column;gap:6px}
.srv .top{display:flex;gap:12px;align-items:center}
.sico{width:64px;height:64px;border:4px solid #000;background:#4f9a35;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P';font-size:22px;object-fit:cover;image-rendering:pixelated;flex:none}
.srv b{font-size:23px}
input.s,select,textarea{width:100%;background:#1c1c1c;color:#fff;border:3px solid #000;box-shadow:inset 3px 3px 0 #000;padding:10px;font-family:'VT323';font-size:21px}
textarea{min-height:90px;resize:vertical}
label{display:block;margin:12px 0 5px;font-size:21px;color:#8aff6a}
.lay{display:block}
.side .mod{display:block;text-decoration:none;padding:10px 12px;margin-bottom:6px;background:#2a2a2a;border:3px solid #000;font-size:21px;cursor:pointer}
.side .mod:hover{background:#3b3b3b}.side .mod.on{background:#4f9a35;box-shadow:inset 2px 2px 0 #86d65f}
.card{cursor:pointer;transition:transform .15s}.card:hover{transform:translateY(-4px)}
table{width:100%;border-collapse:collapse;font-size:20px}td{padding:6px 4px;border-bottom:2px solid #000}
.bar{height:10px;background:#000;margin-top:3px}.bar i{display:block;height:100%;width:0;background:#4f9a35;transition:width 1s steps(10)}
.badge{display:inline-block;font-size:18px;background:#1d4d12;border:3px solid #000;padding:0 8px;color:#8aff6a}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;border:4px solid #000;padding:12px 18px;z-index:99;font-family:'Press Start 2P';font-size:10px}
details summary{cursor:pointer;font-family:'Press Start 2P';font-size:11px;margin:16px 0 10px}
footer{text-align:center;color:#ddd;padding:24px 0 8px;text-shadow:2px 2px #000}
.sk{height:80px;background:rgba(40,40,40,.7);border:4px solid #000;margin-bottom:12px;animation:pu 1s infinite alternate}@keyframes pu{to{opacity:.4}}
@media(min-width:800px){.stats{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(3,1fr)}.lay{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start}.lay .side{position:sticky;top:84px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
</style></head><body>
<canvas id="bg" width="320" height="180"></canvas><div class="veil"></div>
<div class="wrap">
<nav class="panel"><a class="logo" href="#/">⛏ <span id="bn">AURA BOT</span></a>
<div class="links"><a class="l" data-p="" href="#/">Home</a><a class="l" data-p="dashboard" href="#/dashboard">Dashboard</a><a class="l" data-p="commands" href="#/commands">Commands</a><span id="who"></span><a id="auth" class="btn g sm">Login</a></div></nav>
<main id="app"></main>
<footer>⛏ Made with ❤ • Aura Bot</footer>
</div>
<script>
// ====== SIRF YE EK LINE BADLO: apna Railway domain (end me / nahi) ======
const API="https://YOUR-APP.up.railway.app";
// ========================================================================
const $=s=>document.querySelector(s),app=$("#app");
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tok=()=>localStorage.getItem("tk");
const dt=t=>t?new Date(t*1000).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"-";
const up=s=>Math.floor(s/3600)+"h "+Math.floor(s%3600/60)+"m";
async function api(p,o={}){
  const h={"Content-Type":"application/json"};if(tok())h.Authorization="Bearer "+tok();
  const r=await fetch(API+p,{...o,headers:h});
  if(r.status===401)localStorage.removeItem("tk");
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.error||"error"),{status:r.status});
  return j}
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
function go(h){app.innerHTML=h;scrollTo(0,0);
  app.querySelectorAll("[data-n]").forEach(el=>{const t=+el.dataset.n,s=performance.now();(function f(n){const p=Math.min((n-s)/1000,1);el.textContent=Math.round(t*p).toLocaleString();if(p<1)requestAnimationFrame(f)})(s)});
  setTimeout(()=>app.querySelectorAll(".bar i").forEach(b=>b.style.width=b.dataset.w+"%"),120)}
const loginCard=()=>`<div class="panel" style="text-align:center;padding:34px 16px"><span class="ic">🔐</span><h2 style="font-size:14px;line-height:1.6">Dashboard me login karo</h2><p class="mut" style="max-width:480px;margin:0 auto 20px">Discord se authorize karo. Hum sirf tumhara username aur servers ki list dekhte hain. Sirf <b>Administrator</b> wale hi server manage kar sakte hain.</p><a class="btn d" href="${API}/login?site=1">Discord se Authorize karo</a></div>`;

async function home(){
  let s={servers:0,users:0,commands:0,uptime:0,invite:"#",name:"AURA BOT"};
  try{s=await api("/api/stats");$("#bn").textContent=s.name.toUpperCase()}catch(e){}
  const F=[["🎵","Music","YouTube/SoundCloud se gaane, queue, loop."],["🗣️","TTS","Chat me likho, bot voice me bolega."],["🛡️","Moderation","Kick, ban, timeout, warn, logs."],["💰","Economy","Daily, work, slots, leaderboard."],["📈","Levels","Chat karo, XP kamao, level up."],["🎫","Tickets","Support tickets, welcome, auto role."]];
  go(`<div class="hero"><h1>${E(s.name.toUpperCase())}<br>ALL-ROUNDER BOT</h1><p>Music, TTS, moderation, economy aur dashboard. Minecraft jaisa mazedar, sab ek bot me.</p>
  <a class="btn d" href="${E(s.invite)}">➕ Add to Discord</a><a class="btn g" href="#/dashboard">⚙ Manage Servers</a></div>
  <div class="stats"><div class="panel"><span class="num" data-n="${+s.servers}">0</span>Servers</div><div class="panel"><span class="num" data-n="${+s.users}">0</span>Users</div><div class="panel"><span class="num" data-n="${+s.commands}">0</span>Commands</div><div class="panel"><span class="num" style="font-size:14px">${up(+s.uptime)}</span>Uptime</div></div>
  <h2 class="t">✨ Features</h2><div class="grid">${F.map(f=>`<div class="panel"><span class="ic">${f[0]}</span><h3>${f[1]}</h3><span class="mut">${f[2]}</span></div>`).join("")}</div>`)}

async function cmds(){
  const d=await api("/api/commands"),n=Object.values(d).flat().length;
  go(`<h2 class="t">📖 Commands (${n})</h2><input id="q" class="s panel" style="padding:12px" placeholder="🔎 Command dhundo...">`+Object.entries(d).map(([k,v])=>`<div class="panel cc"><h3>${E(k)}</h3>${v.map(c=>`<div class="row">/${E(c.n)} <span class="mut">- ${E(c.d)}</span></div>`).join("")}</div>`).join(""));
  $("#q").oninput=e=>{const v=e.target.value.toLowerCase();app.querySelectorAll(".cc").forEach(c=>{let a=0;c.querySelectorAll(".row").forEach(r=>{const m=r.textContent.toLowerCase().includes(v);r.style.display=m?"":"none";if(m)a=1});c.style.display=a?"":"none"})}}

let ME=null;
async function me(force){if(force||!ME)ME=await api("/api/me");return ME}
const ico=g=>g.icon?`<img class="sico" src="${E(g.icon)}" alt="">`:`<div class="sico">${E(g.name[0])}</div>`;
async function dash(force){
  if(!tok())return go(loginCard());
  const m=await me(force),on=m.guilds.filter(g=>g.bot),off=m.guilds.filter(g=>!g.bot);
  go(`<h2 class="t">Select a server</h2><p class="mut">Tumhare ${m.guilds.length} Administrator servers mile.</p>
  <div style="display:flex;gap:8px"><input id="q" class="s" placeholder="🔎 Search"><a id="rf" class="btn sm">⟳ Refresh</a></div><br>
  <div class="grid" id="sg">${on.map(g=>`<div class="panel srv" data-n2="${E(g.name.toLowerCase())}"><div class="top">${ico(g)}<div><b>${E(g.name)}</b><br><span class="badge">● ${+g.members} Members</span></div></div>
  <span class="mut">📅 Server bana: ${dt(g.created)}</span><span class="mut">🤖 Bot aaya: ${dt(g.joined)}</span><a class="btn g" href="#/dashboard/${E(g.id)}">Open</a></div>`).join("")||'<div class="panel">Bot kisi server me nahi hai. Neeche "Other Servers" se add karo.</div>'}</div>
  <details><summary>▼ Other Servers (${off.length})</summary><div class="grid">${off.map(g=>`<div class="panel srv"><div class="top">${ico(g)}<div><b>${E(g.name)}</b></div></div><a class="btn d" href="${E(g.invite)}">➕ Invite Bot</a></div>`).join("")||'<div class="panel mut">Koi aur server nahi.</div>'}</div></details>`);
  $("#q").oninput=e=>{const v=e.target.value.toLowerCase();app.querySelectorAll("#sg .srv").forEach(c=>c.style.display=(c.dataset.n2||"").includes(v)?"":"none")};
  $("#rf").onclick=()=>dash(true)}

const MODS=[["main","🏠","Main","Overview aur quick links"],["settings","⚙️","Settings","Welcome, auto role, logs"],["announce","📢","Announcements","Embed message bhejo"],["board","🏆","Leaderboard","Aaj, coins, XP"],["warns","⚠️","Warnings","Recent warnings"]];
let GC=null;
async function guild(id,mod="main"){
  if(!tok())return go(loginCard());
  if(!GC||GC.id!==id)GC={id,d:await api("/api/guild/"+encodeURIComponent(id))};
  const g=GC.d,P="/api/guild/"+encodeURIComponent(id);
  const op=(a,sel,p="")=>'<option value="">— koi nahi —</option>'+a.map(x=>`<option value="${E(x.id)}"${x.id===sel?" selected":""}>${p+E(x.name)}</option>`).join("");
  const tb=(a,f)=>`<table>${a.map((x,i)=>`<tr><td>${i+1}</td><td>${E(x.name)}</td><td>${f(x)}</td></tr>`).join("")||'<tr><td class="mut">Abhi data nahi</td></tr>'}</table>`;
  const mx=Math.max(1,...g.today.map(x=>+x.v));
  let body="";
  if(mod==="main")body=`<div class="stats"><div class="panel"><span class="num" data-n="${+g.members}">0</span>Members</div><div class="panel"><span class="num" data-n="${+g.msgs_today}">0</span>Aaj messages</div><div class="panel"><span class="num" data-n="${+g.active_today}">0</span>Aaj active</div><div class="panel"><span class="num" data-n="${+g.warns}">0</span>Warnings</div></div>
    <div class="grid">${MODS.slice(1).map(x=>`<a class="panel card" style="text-decoration:none;display:block" href="#/dashboard/${E(id)}/${x[0]}"><span class="ic">${x[1]}</span><h3>${x[2]}</h3><span class="mut">${x[3]}</span></a>`).join("")}</div>`;
  if(mod==="settings")body=`<form id="f" class="panel"><h3>⚙️ Settings</h3><label>👋 Welcome / Goodbye channel</label><select id="welcome">${op(g.channels,g.settings.welcome,"#")}</select>
    <label>💬 Welcome message ({user} {server} {count})</label><textarea id="wm" maxlength="300">${E(g.welcome_msg)}</textarea>
    <label>🎭 Auto role</label><select id="autorole">${op(g.roles,g.settings.autorole)}</select><label>📜 Log channel</label><select id="log">${op(g.channels,g.settings.log,"#")}</select><br><button class="btn g" type="submit">💾 Save</button></form>`;
  if(mod==="announce")body=`<form id="af" class="panel"><h3>📢 Announcement</h3><label>Channel</label><select id="ac"><option value="">— channel chuno —</option>${g.channels.map(x=>`<option value="${E(x.id)}">#${E(x.name)}</option>`).join("")}</select>
    <label>Title</label><input id="at" class="s" maxlength="100" placeholder="📢 Announcement"><label>Message</label><textarea id="am" maxlength="1500"></textarea><br><button class="btn g" type="submit">🚀 Bhejo</button></form>`;
  if(mod==="board")body=`<div class="panel"><h3>🔥 Aaj ka Leaderboard</h3>${g.today.map((x,i)=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><span>${i+1}. ${E(x.name)}</span><b>${+x.v} msgs</b></div><div class="bar"><i data-w="${Math.round(x.v/mx*100)}"></i></div></div>`).join("")||'<span class="mut">Aaj abhi koi message nahi.</span>'}</div>
    <div class="two"><div class="panel"><h3>💰 Coins</h3>${tb(g.coins,x=>(+x.v).toLocaleString())}</div><div class="panel"><h3>📈 XP</h3>${tb(g.xp,x=>"Lvl "+(+x.lvl)+" ("+(+x.v)+")")}</div></div>`;
  if(mod==="warns")body=`<div class="panel"><h3>⚠️ Recent Warnings</h3><table>${g.warn_list.map(w=>`<tr><td>${E(w.name)}</td><td>${E(w.reason)}</td><td class="mut">${dt(w.ts)}</td></tr>`).join("")||'<tr><td class="mut">Koi warning nahi 🎉</td></tr>'}</table></div>`;
  go(`<div class="lay"><div class="side"><div class="panel"><div class="srv"><div class="top">${ico(g)}<b>${E(g.name)}</b></div><span class="mut">📅 Bana: ${dt(g.created)}</span><span class="mut">🤖 Bot aaya: ${dt(g.joined)}</span></div></div>
  <div class="panel">${MODS.map(x=>`<a class="mod${x[0]===mod?" on":""}" href="#/dashboard/${E(id)}/${x[0]}">${x[1]} ${x[2]}</a>`).join("")}<a class="mod" href="#/dashboard">← Saare servers</a></div></div><div>${body}</div></div>`);
  const f=$("#f");if(f)f.onsubmit=async e=>{e.preventDefault();const b={welcome_msg:$("#wm").value};["welcome","autorole","log"].forEach(k=>b[k]=$("#"+k).value);
    try{await api(P,{method:"POST",body:JSON.stringify(b)});GC=null;toast("✅ SAVED!")}catch(x){toast("❌ SAVE NAHI HUA")}};
  const af=$("#af");if(af)af.onsubmit=async e=>{e.preventDefault();
    try{await api(P+"/announce",{method:"POST",body:JSON.stringify({channel:$("#ac").value,title:$("#at").value,text:$("#am").value})});toast("✅ SENT!");$("#am").value=""}catch(x){toast(x.message==="slow"?"⏳ 5 SEC RUKO":"❌ CHANNEL+MSG DAALO")}}}

async function route(){
  if(location.hash.startsWith("#token=")){localStorage.setItem("tk",location.hash.slice(7));ME=null;location.hash="#/dashboard";return}
  if(API.includes("YOUR-APP"))return go('<div class="panel">⚙️ Setup baaki: <b>index.html</b> me <b>API</b> wali line me apna Railway domain daalo.</div>');
  const [,p,id,m]=(location.hash.slice(1)||"/").split("/");
  document.querySelectorAll(".links a.l").forEach(a=>a.classList.toggle("on",a.dataset.p===(p||"")));
  const au=$("#auth");
  if(tok()){au.textContent="Logout";au.href="#/";au.onclick=()=>{localStorage.removeItem("tk");ME=null;GC=null;$("#who").innerHTML="";setTimeout(route)};
    me().then(x=>{$("#who").innerHTML=x.user.avatar?`<img class="av" src="${E(x.user.avatar)}" alt="">`:""}).catch(()=>{})}
  else{au.textContent="Login";au.href=API+"/login?site=1";au.onclick=null}
  app.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  try{if(p==="commands")await cmds();else if(p==="dashboard")await(id?guild(id,m||"main"):dash());else await home()}
  catch(e){go(e.status===401?loginCard():`<div class="panel">⚠️ Bot se connect nahi ho paya. Bot online hai? <span class="mut">(${E(e.message)})</span></div>`)}}
addEventListener("hashchange",route);route();

// ====== MINECRAFT PVP BACKGROUND ======
(()=>{const cv=$("#bg"),c=cv.getContext("2d"),W=320,H=180,GY=132;let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const gr=document.createElement("canvas");gr.width=W;gr.height=H-GY;const g=gr.getContext("2d");
for(let y=0;y<H-GY;y+=4)for(let x=0;x<W;x+=4){const r=rnd()<.5;g.fillStyle=y<4?(r?"#5db13f":"#4f9a35"):y<28?(r?"#8b5a2b":"#7a4e25"):(r?"#7d7d7d":"#6e6e6e");g.fillRect(x,y,4,4)}
const cl=[{x:40,y:22,w:44,s:.06},{x:170,y:40,w:56,s:.04},{x:280,y:16,w:40,s:.07}];
const mk=(x,f,col)=>({x,ox:x,y:GY,vy:0,vx:0,f,col,hp:10,cd:30,sw:0,fl:0,dead:0}),A=mk(90,1,"#2d7ddb"),B=mk(230,-1,"#d33"),ps=[];
const burst=(x,y,col,n)=>{for(let i=0;i<n;i++)ps.push({x,y,vx:(rnd()-.5)*3,vy:-rnd()*2.5,l:30,col})};
function step(a,b){
  if(a.dead){if(--a.dead===0){a.hp=10;a.x=a.ox;a.vx=0}return}
  const d=b.x-a.x,ad=Math.abs(d);a.f=d>0?1:-1;
  if(ad>16&&!a.sw)a.x+=a.f*.7;if(a.cd>0)a.cd--;
  if(ad<=20&&a.cd<=0&&!a.sw){a.sw=1;a.cd=(38+rnd()*20)|0}
  if(a.sw){a.sw++;if(a.sw===6&&ad<=24&&!b.dead){b.hp--;b.vx=a.f*2.6;b.vy=-2;b.fl=8;burst(b.x,b.y-14,"#e22",6);if(b.hp<=0){b.dead=100;burst(b.x,b.y-10,"#fff",24)}}if(a.sw>12)a.sw=0}
  if(a.y>=GY&&rnd()<.01)a.vy=-2.6;
  a.x+=a.vx;a.vx*=.88;a.vy+=.22;a.y+=a.vy;if(a.y>GY){a.y=GY;a.vy=0}if(a.fl)a.fl--}
function dr(a){if(a.dead)return;const x=Math.round(a.x),y=Math.round(a.y),f=a.f,sk=a.fl?"#f66":"#e0ac69",sh=a.fl?"#f66":a.col;
  c.fillStyle="#3a3a8a";c.fillRect(x-3,y-8,3,8);c.fillRect(x,y-8,3,8);c.fillStyle=sh;c.fillRect(x-3,y-16,6,8);c.fillStyle=sk;c.fillRect(x-3,y-22,6,6);
  c.fillStyle="#222";c.fillRect(x+(f>0?1:-3),y-20,2,2);c.fillStyle=sk;c.fillRect(f>0?x+3:x-5,y-15,2,3);
  c.fillStyle="#bde9ff";if(a.sw>=3&&a.sw<=8)c.fillRect(f>0?x+3:x-13,y-15,10,2);else c.fillRect(x+f*5-1,y-24,2,9);
  c.fillStyle="#6b4a22";c.fillRect(x+f*4-1,y-15,3,2);c.fillStyle="#111";c.fillRect(x-7,y-30,14,3);c.fillStyle="#e33";c.fillRect(x-6,y-29,Math.max(0,a.hp)*1.2,1)}
function frame(){
  const sk=c.createLinearGradient(0,0,0,GY);sk.addColorStop(0,"#5b8cff");sk.addColorStop(1,"#bfe3ff");c.fillStyle=sk;c.fillRect(0,0,W,H);
